name: Build APK
on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Make APK
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps
          echo '{"appId":"com.mahfoud.convertisseur","appName":"Convertisseur Mahfoud","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Convertisseur-Mahfoud-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
